<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Floating hearts background */
        .heart-bg {
            position: fixed;
            font-size: 30px;
            animation: float 6s infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji {
            font-size: 100px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        h1 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        #noBtn:hover {
            transform: scale(1.05);
        }

        .error-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-left: 5px solid #ff6b6b;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            animation: shake 0.5s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .error-card h3 {
            color: #c92a2a;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .error-card p {
            color: #5c5c5c;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .success-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border: 3px solid #f5576c;
            padding: 40px;
            border-radius: 20px;
            animation: celebration 0.6s ease-out;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }

        @keyframes celebration {
            0% {
                transform: scale(0.8) rotate(-5deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.05) rotate(2deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .success-card h2 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .success-card .hearts {
            font-size: 60px;
            margin: 20px 0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .success-card p {
            color: #555;
            font-size: 1.3em;
            line-height: 1.8;
        }

        .hidden {
            display: none;
        }

        .count {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
    <style>
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 30px 20px;
            }

            .emoji {
                font-size: 70px;
            }

            h1 {
                font-size: 1.8em;
            }

            .subtitle {
                font-size: 1em;
                margin-bottom: 30px;
            }

            .buttons {
                flex-direction: column;
                gap: 15px;
            }

            button {
                width: 100%;
                padding: 12px;
                font-size: 1.1em;
            }

            .heart-bg {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="questionCard">
            <div class="emoji">💘</div>
            <h1>Will you be my Valentine?</h1>
            <p class="subtitle">This is a very important question...</p>

            <div class="buttons">
                <button id="yesBtn">YES! 💖</button>
                <button id="noBtn">No</button>
            </div>

            <div id="errorContainer"></div>
            <div class="count" id="noCount"></div>
        </div>

        <div id="successCard" class="hidden">
            <div class="success-card">
                <div class="hearts">💕💖💗</div>
                <h2>Yay! tenchu babyy</h2>
                <!-- <p>You just made me the happiest person in the world! ✨</p> -->
                <p style="margin-top: 20px;">I can't wait to spend Valentine's Day with you! 💑</p>
                <!-- <p style="margin-top: 20px; font-size: 3em;">after exam mo baby go?</p> -->
            </div>
        </div>
    </div>

    <script>
        const errorMessages = [
            {
                title: "⚠️ Error 404: Heart Not Found",
                message: "WARNING: only yes is accepted"
            },
            {
                title: "🚨 System Alert!",
                message: "yes lang po ang accepted"
            },
            {
                title: "❌ Invalid Response Detected",
                message: "uh-uh nope"
            },
            {
                title: "🚨 System Alert!",
                message: "ay bawal nga po"
            },
            {
                title: "💔 Critical Error",
                message: "bawal nga nganiiii"
            },
            {
                title: "🌟 Last Chance Protocol",
                message: "pleaseee"
            },
            {
                title: "🎪 The Universe Has Spoken",
                message: "just click the yes okayyy"
            },
            {
                title: "🦋 Butterfly Effect Alert",
                message: "ay ay ay yes nga po"
            },
            {
                title: "🎨 Reality Check",
                message: "pleas baby koo"
            },
            {
                title: "💝 Final Appeal",
                message: "bembang kita nonstop okii hehe"
            }
        ];

        let noClickCount = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const errorContainer = document.getElementById('errorContainer');
        const questionCard = document.getElementById('questionCard');
        const successCard = document.getElementById('successCard');
        const noCount = document.getElementById('noCount');

        // Create floating hearts in background
        function createFloatingHearts() {
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.textContent = '💕';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(heart);
            }
        }

        createFloatingHearts();

        yesBtn.addEventListener('click', function () {
            questionCard.classList.add('hidden');
            successCard.classList.remove('hidden');

            // Create confetti effect
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.textContent = ['❤️', '💕', '💖', '💗', '💝'][Math.floor(Math.random() * 5)];
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-50px';
                    confetti.style.fontSize = '30px';
                    confetti.style.animation = 'float 3s ease-in forwards';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        });

        noBtn.addEventListener('click', function () {
            if (noClickCount < errorMessages.length) {
                const error = errorMessages[noClickCount];

                errorContainer.innerHTML = `
                    <div class="error-card">
                        <h3>${error.title}</h3>
                        <p>${error.message}</p>
                    </div>
                `;

                noClickCount++;
                noCount.textContent = `"No" attempts: ${noClickCount} ${noClickCount >= 5 ? '(Please reconsider! 🥺)' : ''}`;

                // Make YES button slightly bigger with each NO click
                const currentScale = 1 + (noClickCount * 0.1);
                yesBtn.style.transform = `scale(${currentScale})`;

            } else {
                // After all messages, show a final desperate plea
                errorContainer.innerHTML = `
                    <div class="error-card">
                        <h3>💌 You've Exhausted All My Cards!</h3>
                        <p>I've run out of creative ways to convince you! But my love for you is infinite... Won't you please say yes? 🥺❤️✨</p>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
